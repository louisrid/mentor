[package]
name = "mentor"
version = "0.1.4"
edition = "2021"
rust-version = "1.82"
[lib]
name = "mentor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "mentor"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state"]
[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
